body{background:#f4f7fb;color:#172033;font-family:Arial,"Nirmala UI","Mangal",sans-serif}.bs-wrap{max-width:900px;margin:20px auto;padding:12px 14px 80px}.bs-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bs-back{color:#1769aa;text-decoration:none;font-weight:700}.bs-card,.bs-question{background:#fff;border:1px solid #e3eaf2;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 5px 18px #1720330a}.bs-card h2{margin:0 0 14px}.bs-list{display:grid;gap:10px}.bs-item{width:100%;text-align:left;background:#f7faff;border:1px solid #dce7f3;border-radius:11px;padding:14px;font-size:16px;color:#172033;cursor:pointer}.bs-item:active{background:#eaf3ff}.bs-muted{color:#64748b;font-size:14px}.bs-content{font-size:17px;line-height:1.9;overflow-wrap:anywhere}.bs-content img{max-width:100%;height:auto;display:block;margin:14px auto}.bs-custom-table{overflow-x:auto;margin:14px 0}.bs-custom-table table{border-collapse:collapse;width:100%;min-width:320px}.bs-custom-table th,.bs-custom-table td{border:1px solid #9aa9b8;padding:8px;text-align:center}.bs-content ol,.bs-content ul{padding-left:28px}.bs-content table{max-width:100%}.bs-content h3{font-size:18px;color:#1769aa}.bs-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.bs-nav button,.bs-primary{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}.bs-primary{background:#1769aa;color:white}.bs-outline{background:white;border:1px solid #1769aa!important;color:#1769aa}.bs-nav button:disabled{opacity:.4}.bs-crumb{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;color:#64748b}.bs-crumb button{border:0;background:none;color:#1769aa;cursor:pointer;font-weight:700}.bs-empty{text-align:center;background:#fff;border-radius:14px;padding:26px;margin-top:16px;color:#526174}.bs-class{padding:10px;border:1px solid #ccd5e0;border-radius:9px}

/* Notebook-style solution cards, matching Previous Papers */
