<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>टेस्ट दें | गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
:root{
  --blue:#0867d8;
  --deep:#073b82;
  --text:#17365d;
  --muted:#5d7692;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans Devanagari",Arial,sans-serif}
body{
  background:linear-gradient(145deg,#eef7ff 0%,#ffffff 48%,#f3f9ff 100%);
  color:var(--text);
  overflow:hidden;
}
.test-page{
  min-height:100vh;
  min-height:100dvh;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
}
.test-top{
  text-align:center;
  padding:6px 4px 14px;
}
.test-top a{
  display:inline-block;
  text-decoration:none;
  color:var(--blue);
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}
.test-top h1{
  margin:0;
  font-size:25px;
  line-height:1.25;
  color:var(--deep);
  font-weight:800;
}
.test-top p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}
.test-buttons{
  flex:1;
  display:grid;
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  width:min(100%,760px);
  margin:0 auto;
}
.test-choice{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  text-decoration:none;
  color:var(--text);
  border-radius:24px;
  padding:18px 18px;
  background:#fff;
  border:1px solid #d5e7f8;
  box-shadow:0 10px 28px rgba(28,91,145,.10);
  overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease;
}
.test-choice:active{transform:scale(.985)}
.test-choice::after{
  content:"›";
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:34px;
  line-height:1;
  color:var(--blue);
  font-weight:400;
}
.test-icon{
  width:62px;height:62px;flex:0 0 62px;
  border-radius:18px;
  display:grid;place-items:center;
  font-size:31px;
  background:#eaf5ff;
}
.test-content{min-width:0;padding-right:24px}
.test-content h2{
  margin:0 0 5px;
  font-size:19px;
  line-height:1.25;
  color:#123d70;
}
.test-content p{
  margin:0;
  font-size:12.5px;
  line-height:1.55;
  color:var(--muted);
  max-width:540px;
}
.choice-course .test-icon{background:#eef3ff}
.choice-chapter .test-icon{background:#eefbf5}
.choice-daily .test-icon{background:#fff7e9}
@media(max-width:560px){
  .test-page{padding:10px 9px 12px}
  .test-top{padding:3px 3px 9px}
  .test-top a{font-size:11px;margin-bottom:3px}
  .test-top h1{font-size:21px}
  .test-top p{font-size:10px}
  .test-buttons{gap:9px}
  .test-choice{border-radius:19px;padding:13px 12px;gap:11px}
  .test-icon{width:50px;height:50px;flex-basis:50px;border-radius:14px;font-size:25px}
  .test-content h2{font-size:15px;margin-bottom:3px}
  .test-content p{font-size:10.5px;line-height:1.5}
  .test-choice::after{right:12px;font-size:28px}
}
</style>

<style id="gs-test-selection-final">
  .gs-test-selection {
    min-height: calc(100vh - 90px);
    padding: 18px 14px 28px;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }
  .gs-test-selection h1 {
    text-align:center;
    margin:4px 0 5px;
    font-size:clamp(24px,7vw,34px);
    font-weight:900;
  }
  .gs-test-selection .sub {
    text-align:center;
    margin:0 0 18px;
    font-size:14px;
    opacity:.78;
  }
  .gs-test-card {
    width:100%;
    min-height:150px;
    border:0;
    border-radius:24px;
    margin:7px 0;
    padding:18px 16px;
    display:grid;
    grid-template-columns:72px 1fr 44px;
    align-items:center;
    gap:13px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 9px 22px rgba(0,0,0,.13);
    transition:transform .15s ease;
    box-sizing:border-box;
  }
  .gs-test-card:active { transform:scale(.985); }
  .gs-test-icon {
    width:64px;height:64px;border-radius:50%;
    display:grid;place-items:center;
    font-size:31px;
    background:rgba(255,255,255,.72);
  }
  .gs-test-card h2 {
    margin:0 0 8px;
    font-size:clamp(19px,5.3vw,27px);
    font-weight:900;
  }
  .gs-test-card p {
    margin:0;
    font-size:13px;
    line-height:1.45;
    font-weight:600;
  }
  .gs-test-arrow {
    width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.76);
    font-size:28px;font-weight:900;
  }
  .gs-daily { background:linear-gradient(135deg,#ffd66b,#f6a33b); }
  .gs-chapter { background:linear-gradient(135deg,#8ed4ff,#4b8fe8); }
  .gs-course { background:linear-gradient(135deg,#a9e8a0,#58b96b); }
  .gs-test-footer {
    margin-top:auto;
    text-align:center;
    padding-top:18px;
    font-size:12px;
    opacity:.65;
  }
  @media (min-width:700px) {
    .gs-test-selection { max-width:760px; margin:auto; }
    .gs-test-card { min-height:165px; }
  }
</style>

</head>
<body>
<main class="test-page">

<section class="gs-test-selection" id="gsTestSelection">
  <h1>Test चुनें</h1>
  <p class="sub">अपनी तैयारी को एक नई दिशा दें</p>

  <button class="gs-test-card gs-daily" type="button" data-test="daily">
    <span class="gs-test-icon">📅</span>
    <span>
      <h2>Daily Test</h2>
      <p>रोज़ थोड़ा अभ्यास करें और<br>अपनी तैयारी मजबूत करें।</p>
    </span>
    <span class="gs-test-arrow">›</span>
  </button>

  <button class="gs-test-card gs-chapter" type="button" data-test="chapter">
    <span class="gs-test-icon">📖</span>
    <span>
      <h2>Chapter Practice Test</h2>
      <p>किसी एक अध्याय के 10 प्रश्न<br>हल करके अपनी पकड़ जाँचें।</p>
    </span>
    <span class="gs-test-arrow">›</span>
  </button>

  <button class="gs-test-card gs-course" type="button" data-test="course">
    <span class="gs-test-icon">📊</span>
    <span>
      <h2>Course Progress Test</h2>
      <p>अब तक पढ़े अध्यायों से प्रश्न देकर<br>अपनी पूरी तैयारी जाँचें।</p>
    </span>
    <span class="gs-test-arrow">›</span>
  </button>

  <div class="gs-test-footer">📖 सीखें • अभ्यास करें • आगे बढ़ें</div>
</section>

</main>

<script id="gs-test-card-navigation">
/* Original test cards: navigation only. Existing test pages handle chapter selection/popup. */
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.gs-test-card[data-test]').forEach(function(card){
    card.addEventListener('click', function(){
      var type = card.getAttribute('data-test');
      var target = {
        daily: 'daily-question.html',
        chapter: 'chapter-test.html',
        course: 'course-test.html'
      }[type];
      if(target) window.location.href = target;
    });
  });
});
</script>
</body>
</html>
