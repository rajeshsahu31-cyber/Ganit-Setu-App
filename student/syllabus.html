</style></head><body><main class="sy-wrap"><header class="hero"><div class="brand">GANIT SETU · MP BOARD</div><h1>गणित का पाठ्यक्रम एवं अध्ययन योजना</h1><p>शैक्षणिक सत्र 2026–27<br>महीनेवार इकाई विभाजन और अध्याय सूची</p><span class="chip" id="classChip">कक्षा जाँची जा रही है…</span></header><div id="pageContent"></div><a class="back" href="home.html">← होम पेज पर वापस जाएँ</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script>
<script>
const chapters={"9": ["संख्या पद्धति", "बहुपद", "निर्देशांक ज्यामिति", "दो चरों वाले रैखिक समीकरण", "यूक्लिड की ज्यामिति का परिचय", "रेखाएँ और कोण", "त्रिभुज", "चतुर्भुज", "वृत्त", "हीरोन का सूत्र", "पृष्ठीय क्षेत्रफल और आयतन", "सांख्यिकी"], "10": ["वास्तविक संख्याएँ", "बहुपद", "दो चर वाले रैखिक समीकरण युग्म", "द्विघात समीकरण", "समांतर श्रेढ़ियाँ", "त्रिभुज", "निर्देशांक ज्यामिति", "त्रिकोणमिति का परिचय", "त्रिकोणमिति के कुछ अनुप्रयोग", "वृत्त", "वृत्तों से संबंधित क्षेत्रफल", "पृष्ठीय क्षेत्रफल और आयतन", "सांख्यिकी", "प्रायिकता"]};
const monthly={"9": [{"month": "जून 2026", "kind": "ब्रिज कोर्स", "items": ["ब्रिज कोर्स – अध्याय 2: बहुपद"]}, {"month": "जुलाई 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["इस माह का गणितीय इकाई-विभाजन कैलेंडर के जुलाई माह वाले पृष्ठ से देखें।"]}, {"month": "अगस्त 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["इस माह का गणितीय इकाई-विभाजन कैलेंडर के अगस्त माह वाले पृष्ठ से देखें।"]}, {"month": "सितंबर 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["इस माह का गणितीय इकाई-विभाजन कैलेंडर के सितंबर माह वाले पृष्ठ से देखें।"]}, {"month": "अक्टूबर 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["इस माह का गणितीय इकाई-विभाजन कैलेंडर के अक्टूबर माह वाले पृष्ठ से देखें।"]}, {"month": "नवंबर 2026 – अप्रैल 2027", "kind": "पुनरावृत्ति एवं शेष योजना", "items": ["कैलेंडर के संबंधित माह के इकाईवार पृष्ठ से योजना का पालन करें।"]}], "10": [{"month": "जून 2026", "kind": "ब्रिज कोर्स", "items": ["ब्रिज कोर्स – अध्याय 2: संबंध एवं फलन"]}, {"month": "जुलाई 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["अध्याय 3 – दो चर वाले रैखिक समीकरण युग्म", "अध्याय 4 – द्विघात समीकरण", "अध्याय 5 – समांतर श्रेणियाँ"]}, {"month": "अगस्त 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["अध्याय 2 – बहुपद", "अध्याय 6 – त्रिभुज", "अध्याय 7 – निर्देशांक ज्यामिति"]}, {"month": "सितंबर 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["अध्याय 4 – दो चरों वाले रैखिक समीकरण युग्म", "अध्याय 8 – त्रिकोणमिति का परिचय"]}, {"month": "अक्टूबर 2026", "kind": "इकाईवार पाठ्यक्रम", "items": ["अध्याय 6 – रेखाएँ", "अध्याय 7 – त्रिभुज", "अध्याय 9 – त्रिकोणमिति के कुछ अनुप्रयोग", "अध्याय 10 – वृत्त", "अध्याय 11 – वृत्तों से संबंधित क्षेत्रफल"]}, {"month": "नवंबर 2026 – अप्रैल 2027", "kind": "शेष इकाइयाँ / पुनरावृत्ति", "items": ["कैलेंडर के संबंधित माह के इकाईवार पृष्ठ के अनुसार आगे का अध्ययन करें।"]}]};
function render(cls){
 document.getElementById('classChip').textContent='कक्षा '+cls+'वीं · गणित';
 const units=monthly[cls];
 let h=`<div class="stats"><div class="stat"><b>${chapters[cls].length}</b><small>कुल अध्याय</small></div><div class="stat"><b>${units.length}</b><small>योजना खंड</small></div><div class="stat"><b>2026–27</b><small>शैक्षणिक सत्र</small></div></div><h2 class="sect">महीने के अनुसार अध्ययन योजना</h2>`;
 h+=units.map((m,i)=>`<details class="month" ${i===0?'open':''}><summary><span class="mno">${String(i+1).padStart(2,'0')}</span><span>${m.month}</span><span class="mtag">${m.kind}</span></summary><div class="mbody"><ul>${m.items.map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`).join('');
 h+='<h2 class="sect">पूरे वर्ष के अध्याय</h2>'+chapters[cls].map((c,i)=>`<div class="chapter"><span class="cno">${i+1}</span><span class="ctitle">अध्याय ${i+1} – ${c}</span></div>`).join('');
 h+='<div class="note"><b>महत्वपूर्ण:</b> विद्यार्थी की कक्षा उसके लॉगिन प्रोफाइल से ली जाती है। केवल उसी कक्षा का पाठ्यक्रम दिखेगा। महीनेवार प्रविष्टियाँ उपलब्ध शैक्षणिक कैलेंडर के पढ़े जा सकने वाले गणितीय विवरण पर आधारित हैं; जहाँ कैलेंडर की तालिका स्पष्ट नहीं थी, वहाँ कोई अध्याय अनुमान से नहीं जोड़ा गया है।</div>';
 document.getElementById('pageContent').innerHTML=h;
}
(async()=>{
 const sid=sessionStorage.getItem('ganit_setu_student_id');
 const box=document.getElementById('pageContent');
 if(!sid){box.innerHTML='<div class="error">कृपया पहले विद्यार्थी लॉगिन करें।</div>';return;}
 let cls=Number(sessionStorage.getItem('ganit_setu_student_class'));
 if(cls!==9&&cls!==10){
  try{const {data,error}=await supabaseClient.from('students').select('class_level').eq('student_id',sid).maybeSingle();if(error)throw error;cls=Number(data?.class_level);if(cls===9||cls===10)sessionStorage.setItem('ganit_setu_student_class',String(cls));}
  catch(e){console.error(e);}
 }
 if(cls!==9&&cls!==10){box.innerHTML='<div class="error">आपकी कक्षा की जानकारी नहीं मिली। कृपया दोबारा लॉगिन करें या स्कूल से संपर्क करें।</div>';return;}
 render(String(cls));
})();
</script></body></html>
