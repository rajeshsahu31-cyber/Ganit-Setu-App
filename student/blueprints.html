function renderBlueprint(cls){
 const data=blueprintData[String(cls)];
 document.getElementById('gsClassLabel').textContent='कक्षा – '+cls+'वीं · विषय – गणित Basic / गणित Standard';
 let rows=data.chapters.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
 document.getElementById('gsBlueprintContent').innerHTML=`
 <div class="gs-meta">
 <div><b>75 अंक</b><small>पूर्णांक</small></div>
 <div><b>3:00 घंटे</b><small>समय</small></div>
 <div><b>${data.chapters.length} अध्याय</b><small>अध्यायवार अंक योजना</small></div>
 </div>
 <details class="gs-panel" open>
 <summary><span>विषय-वस्तु एवं आवंटित अंक</span><span>⌄</span></summary>
 <div class="gs-content"><div class="gs-table-wrap"><table class="gs-table">
 <thead><tr><th>क्र.</th><th>विषय वस्तु</th><th>आवंटित अंक</th></tr></thead>
 <tbody>${rows}</tbody><tfoot><tr><td colspan="2">कुल योग</td><td>75</td></tr></tfoot>
 </table></div></div></details>

 <div class="gs-source">स्रोत: माध्यमिक शिक्षा मंडल, मध्यप्रदेश, भोपाल — हाईस्कूल परीक्षा सत्र 2026–27, अंक योजना। कक्षा ${cls}वीं का मूल अंक योजना पृष्ठ ${data.page} (दस्तावेज़ का पृष्ठ क्रमांक)। ऊपर विषय-वस्तु, अंक और नोट मूल दस्तावेज़ के अनुसार टाइप किए गए हैं।</div>`;

(async()=>{
 const sid=sessionStorage.getItem('ganit_setu_student_id');
 const box=document.getElementById('gsBlueprintContent');
 if(!sid){box.innerHTML='<div class="gs-error">कृपया पहले विद्यार्थी लॉगिन करें।</div>';return;}
 let cls=Number(sessionStorage.getItem('ganit_setu_student_class'));
 if(cls!==9&&cls!==10){
  try{
   const {data,error}=await supabaseClient.from('students').select('class_level').eq('student_id',sid).maybeSingle();
   if(error)throw error;
   cls=Number(data?.class_level);
   if(cls===9||cls===10)sessionStorage.setItem('ganit_setu_student_class',String(cls));
  }catch(e){console.error(e);}
 }
 if(cls!==9&&cls!==10){box.innerHTML='<div class="gs-error">आपकी कक्षा की जानकारी नहीं मिली। कृपया दोबारा लॉगिन करें।</div>';return;}
 renderBlueprint(cls);
})();
